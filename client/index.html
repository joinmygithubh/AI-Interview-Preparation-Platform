<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Apply saved theme before first paint to avoid a flash -->
    <script>
      (function () {
        try {
          var m = localStorage.getItem('theme-mode');
          var el = document.documentElement;
          if (m === 'dark') el.classList.add('dark');
          else if (m === 'mono') el.classList.add('theme-mono');
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Sora:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>AI Interview Coach</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
